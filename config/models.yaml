# Model Configuration for AgentEval
# This file defines available LLM models and their settings

models:
  # OpenAI Models
  gpt-4-turbo:
    adapter_type: litellm
    model_name: gpt-4-turbo-preview
    provider: openai
    api_key: ${OPENAI_API_KEY}
    max_input_tokens: 128000
    max_output_tokens: 4096
    pricing:
      input_per_1m: 10.0
      output_per_1m: 30.0

  gpt-4o:
    adapter_type: litellm
    model_name: gpt-4o
    provider: openai
    api_key: ${OPENAI_API_KEY}
    max_input_tokens: 128000
    max_output_tokens: 4096
    pricing:
      input_per_1m: 5.0
      output_per_1m: 15.0

  gpt-3.5-turbo:
    adapter_type: litellm
    model_name: gpt-3.5-turbo
    provider: openai
    api_key: ${OPENAI_API_KEY}
    max_input_tokens: 16385
    max_output_tokens: 4096
    pricing:
      input_per_1m: 0.5
      output_per_1m: 1.5

  # Anthropic Claude Models
  claude-3-opus:
    adapter_type: litellm
    model_name: claude-3-opus-20240229
    provider: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    max_input_tokens: 200000
    max_output_tokens: 4096
    pricing:
      input_per_1m: 15.0
      output_per_1m: 75.0

  claude-3-sonnet:
    adapter_type: litellm
    model_name: claude-3-sonnet-20240229
    provider: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    max_input_tokens: 200000
    max_output_tokens: 4096
    pricing:
      input_per_1m: 3.0
      output_per_1m: 15.0

  claude-3-haiku:
    adapter_type: litellm
    model_name: claude-3-haiku-20240307
    provider: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    max_input_tokens: 200000
    max_output_tokens: 4096
    pricing:
      input_per_1m: 0.25
      output_per_1m: 1.25

  # Alibaba Qwen Models
  qwen-max:
    adapter_type: litellm
    model_name: qwen/qwen-max
    provider: dashscope
    api_key: ${DASHSCOPE_API_KEY}
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    max_input_tokens: 32000
    max_output_tokens: 8192
    pricing:
      input_per_1m: 0.5
      output_per_1m: 1.5

  qwen-plus:
    adapter_type: litellm
    model_name: qwen/qwen-plus
    provider: dashscope
    api_key: ${DASHSCOPE_API_KEY}
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    max_input_tokens: 32000
    max_output_tokens: 8192
    pricing:
      input_per_1m: 0.2
      output_per_1m: 0.6

  # DeepSeek Models
  deepseek-chat:
    adapter_type: litellm
    model_name: deepseek/deepseek-chat
    provider: deepseek
    api_key: ${DEEPSEEK_API_KEY}
    api_base: https://api.deepseek.com/v1
    max_input_tokens: 64000
    max_output_tokens: 4096
    pricing:
      input_per_1m: 0.14
      output_per_1m: 0.28

  deepseek-coder:
    adapter_type: litellm
    model_name: deepseek/deepseek-coder
    provider: deepseek
    api_key: ${DEEPSEEK_API_KEY}
    api_base: https://api.deepseek.com/v1
    max_input_tokens: 64000
    max_output_tokens: 4096
    pricing:
      input_per_1m: 0.14
      output_per_1m: 0.28
